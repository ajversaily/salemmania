<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salem Mania</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=IM+Fell+English:ital@0;1&family=Source+Code+Pro:wght@400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    /* ── BASE & RESET ─────────────────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080603; font-family: 'Source Code Pro', monospace; overflow-x: hidden; }
    
    /* ── STAGE ────────────────────────────────────── */
    .stage {
      position: relative;
      width: 100vw; height: 100vh; min-height: 600px;
      overflow: hidden;
    }

    /* Deep night tribunal sky */
    .stage-bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 90% 55% at 50% 0%, rgba(70,18,8,.95) 0%, transparent 65%),
        linear-gradient(180deg, #060402 0%, #0e0806 45%, #080503 100%);
    }

    /* ── FIRE EFFECTS ─────────────────────────────── */
    .stage-fire {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 180px; pointer-events: none; z-index: 1;
    }
    .fire-layer { position: absolute; bottom: 0; left: 0; right: 0; }
    .fire-layer-1 { height: 180px; background: radial-gradient(ellipse 90% 100% at 50% 100%, rgba(200,0,42,.22) 0%, rgba(212,66,10,.1) 35%, transparent 70%); animation: fireSwell1 3.2s ease-in-out infinite alternate; }
    .fire-layer-2 { height: 120px; background: radial-gradient(ellipse 55% 100% at 50% 100%, rgba(200,0,42,.18) 0%, rgba(212,66,10,.08) 45%, transparent 75%); animation: fireSwell2 2.4s ease-in-out infinite alternate; }
    .fire-layer-3 { height: 70px; background: radial-gradient(ellipse 28% 100% at 50% 100%, rgba(200,0,42,.28) 0%, rgba(232,114,10,.12) 50%, transparent 80%); animation: fireSwell3 1.8s ease-in-out infinite alternate; }

    @keyframes fireSwell1 { from { transform: scaleX(1) scaleY(1); opacity: 1; } to { transform: scaleX(1.04) scaleY(1.08); opacity: .85; } }
    @keyframes fireSwell2 { from { transform: scaleX(1) scaleY(1); opacity: .9; } to { transform: scaleX(.96) scaleY(1.12); opacity: 1; } }
    @keyframes fireSwell3 { from { transform: scaleX(1) scaleY(1); opacity: .8; } to { transform: scaleX(1.08) scaleY(.9); opacity: 1; } }

    /* ── CANVASES ─────────────────────────────────── */
    #webCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; z-index: 2; }
    #emberCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 3; }

    /* ── TYPOGRAPHY & UI ──────────────────────────── */
    .stage-ui {
      position: absolute; inset: 0; z-index: 10;
      display: flex; align-items: center; pointer-events: none;
      padding: 4rem;
    }
    
    .title-block { max-width: 400px; }
    .masthead-year { font-size: .65rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: rgba(200,0,42,.85); display: block; margin-bottom: 1rem; opacity: 0; animation: fadeIn .8s ease .3s both; }
    .masthead-title { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(3.5rem, 8vw, 6rem); font-weight: 900; letter-spacing: -.02em; line-height: 0.9; color: #f0e8d5; display: block; text-shadow: 0 0 30px rgba(200,0,42,.4), 0 2px 4px rgba(0,0,0,.8); opacity: 0; animation: fadeIn .9s ease .4s both; }
    .masthead-hint { font-size: .55rem; letter-spacing: .15em; text-transform: uppercase; color: rgba(240,232,213,.4); display: block; margin-top: 2rem; opacity: 0; animation: fadeIn .5s ease 1.5s both; }

    /* Tooltip */
    .node-tip { position: fixed; z-index: 150; pointer-events: none; opacity: 0; transform: translateY(8px); transition: opacity .15s ease, transform .15s ease; }
    .node-tip.show { opacity: 1; transform: translateY(0); }
    .node-tip-inner { background: rgba(8,6,3,.97); border: 1px solid rgba(200,0,42,.45); border-top: 2px solid rgba(200,0,42,.9); padding: .8rem 1.2rem; white-space: nowrap; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,.6), 0 0 12px rgba(200,0,42,.1); }
    .nt-tag { font-size: .55rem; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: rgba(200,0,42,.85); display: block; margin-bottom: .2rem; }
    .nt-name { font-family: 'Playfair Display', Georgia, serif; font-size: 1.1rem; font-weight: 700; color: #f0e8d5; display: block; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Responsive Adjustments */
    @media (max-width: 800px) {
      .stage-ui { padding: 2rem; align-items: flex-start; justify-content: center; text-align: center; }
      .masthead-title { font-size: 4rem; }
    }
  </style>
</head>
<body>

  <section class="stage" id="stage">
    <div class="stage-bg"></div>

    <div class="stage-fire">
      <div class="fire-layer fire-layer-1"></div>
      <div class="fire-layer fire-layer-2"></div>
      <div class="fire-layer fire-layer-3"></div>
    </div>

    <canvas id="emberCanvas"></canvas>
    <canvas id="webCanvas"></canvas>

    <div class="stage-ui">
      <div class="title-block">
        <span class="masthead-year">Est. Ohio · MMXXVI</span>
        <h1 class="masthead-title">Salem<br>Mania</h1>
        <span class="masthead-hint">Explore the network</span>
      </div>
    </div>

    <div class="node-tip" id="nodeTip">
      <div class="node-tip-inner">
        <span class="nt-tag"  id="tipTag"></span>
        <span class="nt-name" id="tipName"></span>
      </div>
    </div>
  </section>

  <script>
  (function () {
    'use strict';

    /* ══════════════════════════════════════════════
       SPIDERWEB NAVIGATION - STRETCHED LAYOUT
    ══════════════════════════════════════════════ */
    var canvas = document.getElementById('webCanvas');
    var ctx    = canvas.getContext('2d');
    var stage  = document.getElementById('stage');
    var tip    = document.getElementById('nodeTip');

    // Layout configuration using relative percentages for X and Y
    // deskRx/Ry = Desktop positions, mobRx/Ry = Mobile positions
    var NODES = [
      { tag: 'Read',        name: 'Articles',          href: 'articles.html',          deskRx: 0.65, deskRy: 0.25, mobRx: 0.75, mobRy: 0.20, R: 8,   pulse: true  },
      { tag: 'Issue No.1',  name: 'The Mania Begins.', href: 'articlesalemmania.html', deskRx: 0.45, deskRy: 0.85, mobRx: 0.30, mobRy: 0.75, R: 6,   pulse: false },
      { tag: 'Pitch Open',  name: 'Get Involved',      href: 'get-involved.html',      deskRx: 0.80, deskRy: 0.55, mobRx: 0.85, mobRy: 0.45, R: 8,   pulse: true  },
      { tag: 'Network',     name: 'Those Involved',    href: 'those-involved.html',    deskRx: 0.75, deskRy: 0.80, mobRx: 0.70, mobRy: 0.85, R: 6,   pulse: false },
      { tag: 'Follow',      name: 'Instagram',         href: '#',                      deskRx: 0.85, deskRy: 0.35, mobRx: 0.25, mobRy: 0.45, R: 5.5, pulse: false },
      { tag: 'Open Source', name: 'GitHub',            href: '#',                      deskRx: 0.50, deskRy: 0.15, mobRx: 0.20, mobRy: 0.30, R: 5.5, pulse: false }
    ];

    var W, H, cx, cy, isMobile;
    var mouse   = { x: -9999, y: -9999 };
    var hovered = null;
    var t       = 0;

    function resize() {
      W = canvas.width  = stage.offsetWidth;
      H = canvas.height = stage.offsetHeight;
      isMobile = W < 800;

      // Hub positioning: 
      // Desktop: Center-left (near the title)
      // Mobile: Dead center or lower middle to allow title up top
      cx = isMobile ? W * 0.50 : W * 0.35;
      cy = isMobile ? H * 0.60 : H * 0.55;

      NODES.forEach(function (n) {
        n.x = isMobile ? W * n.mobRx : W * n.deskRx;
        n.y = isMobile ? H * n.mobRy : H * n.deskRy;
      });
    }

    // Helper to generate concentric ring points across the non-uniform node spread
    function ringPts(ringRatio) {
      var pts = [];
      NODES.forEach(function (n) {
        var dx = n.x - cx, dy = n.y - cy;
        pts.push({ 
          x: cx + dx * ringRatio, 
          y: cy + dy * ringRatio, 
          a: Math.atan2(dy, dx) 
        });
      });
      pts.sort(function (a, b) { return a.a - b.a; });
      return pts;
    }

    function drawWeb() {
      ctx.clearRect(0, 0, W, H);
      t += 0.015;

      // 1. Detect Hover
      hovered = null;
      NODES.forEach(function (n) { if (Math.hypot(mouse.x - n.x, mouse.y - n.y) < 46) hovered = n; });

      // 2. Draw Spokes radiating from hub
      NODES.forEach(function (n) {
        var isHov = hovered === n;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(n.x, n.y);
        ctx.strokeStyle = isHov ? 'rgba(200,0,42,.95)' : 'rgba(200,0,42,0.2)';
        ctx.lineWidth   = isHov ? 1.5 : .85;
        ctx.stroke();
      });

      // 3. Draw Concentric Web Rings mapping the spread
      var RINGS = 5;
      for (var ri = 1; ri <= RINGS; ri++) {
        var ratio = ri / RINGS;
        var pts   = ringPts(ratio);
        
        for (var pi = 0; pi < pts.length; pi++) {
          var a = pts[pi], b = pts[(pi + 1) % pts.length];
          // Determine control point for curved webbing
          var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
          var cpx = cx + (mx - cx) * 0.9, cpy = cy + (my - cy) * 0.9;

          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.quadraticCurveTo(cpx, cpy, b.x, b.y);
          ctx.strokeStyle = 'rgba(200,0,42,' + (0.05 + ri * 0.02) + ')';
          ctx.lineWidth = .6;
          ctx.stroke();
        }
      }

      // 4. Draw Nodes
      NODES.forEach(function (n, i) {
        var isHov = hovered === n;
        var pulse = n.pulse ? .88 + Math.sin(t * 1.6 + i) * .12 : 1;
        var r     = (isHov ? n.R * 1.85 : n.R) * pulse;

        // Outer ring
        ctx.beginPath();
        ctx.arc(n.x, n.y, r + 5, 0, Math.PI * 2);
        ctx.strokeStyle = isHov ? 'rgba(200,0,42,0.85)' : 'rgba(200,0,42,0.4)';
        ctx.lineWidth = isHov ? 1.4 : .7;
        ctx.stroke();

        // Core dot
        ctx.beginPath();
        ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
        ctx.fillStyle = isHov ? '#c8002a' : 'rgba(175,8,28,0.8)';
        ctx.fill();
      });

      // 5. Draw Central Hub
      ctx.beginPath();
      ctx.arc(cx, cy, 10 + Math.sin(t * 1.5) * 2, 0, Math.PI * 2);
      ctx.fillStyle = '#8b0015';
      ctx.fill();
      
      var forgeGrd = ctx.createRadialGradient(cx, cy, 0, cx, cy, 12);
      forgeGrd.addColorStop(0, 'rgba(240,168,32,' + (.6 + Math.sin(t * 3) * .28) + ')');
      forgeGrd.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.arc(cx, cy, 12, 0, Math.PI * 2);
      ctx.fillStyle = forgeGrd;
      ctx.fill();

      renderTip();
      canvas.style.cursor = hovered ? 'pointer' : 'default';
      requestAnimationFrame(drawWeb);
    }

    function renderTip() {
      if (!hovered) { tip.classList.remove('show'); return; }
      document.getElementById('tipTag').textContent  = hovered.tag;
      document.getElementById('tipName').textContent = hovered.name;
      tip.classList.add('show');
      
      var rect = canvas.getBoundingClientRect();
      var tw = tip.offsetWidth, th = tip.offsetHeight;
      var tx = rect.left + hovered.x - tw / 2;
      var ty = rect.top  + hovered.y - th - 25;
      
      if (ty < 20) ty = rect.top + hovered.y + 25;
      if (tx < 10) tx = 10;
      if (tx + tw > window.innerWidth - 10) tx = window.innerWidth - tw - 10;
      
      tip.style.left = tx + 'px';
      tip.style.top  = ty + 'px';
    }

    /* Input Events */
    function trackMouse(e) {
      var r = canvas.getBoundingClientRect();
      mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
    }
    canvas.addEventListener('mousemove', trackMouse);
    canvas.addEventListener('mouseleave', function () { mouse.x = mouse.y = -9999; });
    canvas.addEventListener('click', function () {
      if (hovered) window.location.href = hovered.href;
    });

    // Unified touch handling for Mobile
    canvas.addEventListener('touchstart', function(e) {
      e.preventDefault();
      trackMouse(e.touches[0]);
      var found = null;
      NODES.forEach(function (n) { if (Math.hypot(mouse.x - n.x, mouse.y - n.y) < 52) found = n; });
      if (found && hovered === found) window.location.href = found.href;
      hovered = found;
    }, { passive: false });
    
    canvas.addEventListener('touchmove', function(e) { e.preventDefault(); trackMouse(e.touches[0]); }, { passive: false });
    canvas.addEventListener('touchend', function(e) { e.preventDefault(); setTimeout(function() { mouse.x = mouse.y = -9999; }, 1500); }, { passive: false });

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(drawWeb);
  })();

  /* ══════════════════════════════════════════════
     SIMPLE EMBER SYSTEM (Retained for Atmosphere)
  ══════════════════════════════════════════════ */
  (function () {
    const ec = document.getElementById('emberCanvas');
    const ect = ec.getContext('2d');
    let EW, EH, particles = [];

    function init() {
      EW = ec.width = window.innerWidth;
      EH = ec.height = window.innerHeight;
    }
    window.addEventListener('resize', init);
    init();

    function Particle() {
      this.x = EW / 2 + (Math.random() - 0.5) * EW * 0.8;
      this.y = EH + 10;
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = -(1 + Math.random() * 2);
      this.r = Math.random() * 2.5 + 0.5;
      this.life = 0;
      this.maxLife = 50 + Math.random() * 100;
    }

    function animateEmbers() {
      ect.clearRect(0, 0, EW, EH);
      if (particles.length < 40 && Math.random() < 0.3) particles.push(new Particle());

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.life++; p.x += p.vx; p.y += p.vy;
        p.vy -= 0.02; p.r *= 0.98;

        ect.beginPath();
        ect.arc(p.x, p.y, Math.max(0.2, p.r), 0, Math.PI * 2);
        ect.fillStyle = `rgba(212, 66, 10, ${1 - p.life / p.maxLife})`;
        ect.fill();

        if (p.life > p.maxLife || p.r < 0.2) particles.splice(i, 1);
      }
      requestAnimationFrame(animateEmbers);
    }
    animateEmbers();
  })();
  </script>
</body>
</html>
