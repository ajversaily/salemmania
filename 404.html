<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Source+Code+Pro:wght@400;600&family=UnifrakturMaguntia&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #c8002a;
      --ink: #1a1208;
      --paper: #f0e8d5;
      --dust: #7a6e5a;
    }

    body {
      background: #080603;
      color: var(--paper);
      font-family: 'Source Code Pro', monospace;
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }


    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
    }

    .container {
      max-width: 600px;
      padding: 2rem;
      border: 1px solid rgba(200, 0, 42, 0.2);
      background: rgba(10, 8, 6, 0.8);
      position: relative;
    }

    .glitch-title {
      font-family: 'UnifrakturMaguntia', serif;
      font-size: 6rem;
      color: var(--red);
      margin-bottom: 0;
      line-height: 1;
      text-shadow: 0 0 15px rgba(200, 0, 42, 0.4);
    }

    .caption {
      font-family: 'Source Code Pro', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin: 20px 0;
      color: var(--dust);
    }

    .back-home {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      border: 1px solid var(--red);
      color: var(--paper);
      text-decoration: none;
      transition: all 0.3s ease;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .back-home:hover {
      background: var(--red);
      color: white;
      box-shadow: 0 0 20px rgba(200, 0, 42, 0.5);
    }

    .spoke-bg {
      position: absolute;
      z-index: -1;
      opacity: 0.1;
      animation: spin 60s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <svg class="spoke-bg" width="800" height="800" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="90" stroke="#c8002a" stroke-width="0.5" fill="none" />
    <path d="M100 10 L100 190 M10 100 L190 100 M36 36 L164 164 M36 164 L164 36" stroke="#c8002a" stroke-width="0.3" />
  </svg>

  <div class="container">
    <div class="glitch-title">404</div>
    <p class="caption">404! Silly, this page doesn't exist!</p>
    <p style="font-size: 0.75rem; opacity: 0.5; margin-bottom: 20px;">
      [ ERROR: PAGE_NOT_FOUND_IN_TRIBUNAL_ARCHIVE ]
    </p>
    <a href="index.html" class="back-home">RETURN</a>
  </div>

  <script>
    // Subtle tilt effect
    document.addEventListener('mousemove', (e) => {
      const container = document.querySelector('.container');
      const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
      container.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });
  </script>
</body>
</html>
