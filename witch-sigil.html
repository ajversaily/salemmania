<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SALEM MANIA LOGO</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #ffffff;
  }
  svg {
    width: 300px;
    height: 300px;
  }
  path {
    stroke: black;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
</style>
</head>
<body>

<svg viewBox="0 0 300 300">

  <!-- Left abstract curve -->
  <path d="
    M70 170
    C85 150, 100 155, 110 135
    C115 125, 105 115, 95 110
    C85 105, 80 95, 85 85
    C95 75, 110 80, 120 90
  "/>

  <!-- Face outline -->
  <path d="
    M130 160
    C150 140, 170 125, 200 110
    C220 100, 245 115, 255 140
    C260 155, 255 180, 240 205
    C225 230, 210 250, 200 265
  "/>

  <!-- Nose / inner contour -->
  <path d="
    M185 115
    C195 90, 215 80, 235 90
  "/>

  <!-- Lips / center detail -->
  <path d="
    M150 185
    C170 175, 190 185, 205 200
  "/>

  <!-- Lower curve / neck -->
  <path d="
    M200 200
    C215 215, 225 230, 235 250
  "/>

  <!-- Small top stroke -->
  <path d="
    M200 135
    C210 125, 225 120, 240 125
  "/>

</svg>

</body>
</html>
