<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Witch Sigil — Salem Mania</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --char: #080603;
      --soot: #120d08;
      --moon: #f0e8d5;
      --pyre: #c8002a;
      --ember: #e8720a;
      --pyre-glow: rgba(200,0,42,.38);
      --font-display: 'Playfair Display', Georgia, serif;
      --font-mono: 'Source Code Pro', monospace;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse 70% 60% at 50% 20%, rgba(200,0,42,.10), transparent 65%), var(--soot);
      color: var(--moon);
    }

    .sigil-img {
      width: min(260px, 70vw);
      height: auto;
      display: block;
      box-shadow:
        0 0 22px rgba(200,0,42,.14),
        0 16px 40px rgba(0,0,0,.55);
      filter: contrast(1.02) saturate(1.02) brightness(1.02) drop-shadow(0 0 18px rgba(200,0,42,.18));
    }
  </style>
</head>
<body>
  <img class="sigil-img" src="assets/witch-sigil.png" alt="Witch sigil" loading="eager" decoding="async" />
</body>
</html>
